<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/NFT_Abstract.png">
    <title>Contact Me</title>
    <meta name="author" content="Jonathan J. Schroeder">
    <meta name="description" content="A page to contact the artist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <!-- header section that remains anchored to the top of the page -->
    <header class="p-0 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img class="d-flex align-items-center mb-2 bm-lg-0 mt-2 mt-lg-0" src="./images/NFT_Abstract.png"
                        alt="Website Icon" width="40" height="32">
                </a>
                <ul class="nav col-12 col-lg-auto me-lg-auto ms-3 mb-2 justify-content-center mb-md-0">
                    <li><a href="./index.html" class="nav-link px-2 text-secondary">Home</a></li>
                    <li><a href="./index.html#Featured-Project" class="nav-link px-2 text-secondary">Featured
                            Project</a></li>
                    <li><a href="./index.html#Project-Gallery" class="nav-link px-2 text-secondary">Projects</a></li>
                    <li><a href="./index.html#Artist-About" class="nav-link px-2 text-secondary">About</a></li>
                    <li><a href="./contact.html" class="nav-link px-2 text-secondary">Contact</a></li>

                </ul>
                <div class="text-end">
                    <button type="button" class="btn btn-outline-primary">Connect Wallet</button>
                </div>
            </div>
        </div>
    </header>
    <div>Contact</div>

    <form id="contact-form" class="needs-validation" novalidate>
        <div class="row mx-5">
            <div class="col">
                <input type="text" id="first-name" class="form-control" placeholder="First name" aria-label="First name"
                    required>
            </div>
            <div class="col">
                <input type="text" id="last-name" class="form-control" placeholder="Last name" aria-label="Last name"
                    required>
            </div>
        </div>
        <div class="m-5">
            <input type="email" id="mail" class="form-control" id="exampleInputEmail1" placeholder="Email Address"
                aria-label="Email Address" required>
            <div id="emailFeedback" class="invalid-feedback">
                Format should be example@example.net
            </div>

        </div>
        <div class=" m-5">
            <textarea class="form-control" id="msg" placeholder="Enter your message here:" rows="6" required></textarea>
        </div>
        <button id="contact-form-button" type="submit" class=" mx-5 btn btn-primary">Submit</button>
    </form>


    <script type="module" src="./js/contact.js"></script>
</body>

</html>
